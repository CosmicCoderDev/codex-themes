<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Codex Muse · 美女主题皮肤库</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body data-theme="berry">
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand-row">
        <div class="brand-mark">C</div>
        <div><strong>Codex Muse</strong><span>灵感皮肤库</span></div>
      </div>

      <nav class="main-nav" aria-label="主导航">
        <button class="nav-item active" type="button"><span>＋</span>新建任务</button>
        <button class="nav-item" type="button"><span>◷</span>已安排</button>
        <button class="nav-item" type="button"><span>◇</span>主题收藏</button>
        <button class="nav-item" type="button"><span>⌘</span>代码实验室</button>
      </nav>

      <div class="sidebar-section">
        <p class="section-label">皮肤衣橱</p>
        <div class="theme-list" role="list" aria-label="选择人物主题">
          <button class="theme-choice active" type="button" data-theme-choice="berry" role="listitem" aria-pressed="true">
            <img src="assets/sweet-berry.png" alt="甜莓粉主题缩略图">
            <span><strong>甜莓粉</strong><small>柔光与蝴蝶结</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="nebula" role="listitem" aria-pressed="false">
            <img src="assets/nebula-oracle.png" alt="星河紫主题缩略图">
            <span><strong>星河紫</strong><small>观星者与星云</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="cyber" role="listitem" aria-pressed="false">
            <img src="assets/cyber-engineer.png" alt="赛博青主题缩略图">
            <span><strong>赛博青</strong><small>工程师与霓虹</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="oriental" role="listitem" aria-pressed="false">
            <img src="assets/oriental-muse.png" alt="东方红主题缩略图">
            <span><strong>东方红</strong><small>朱砂与水墨</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="midnightglamour" role="listitem" aria-pressed="false">
            <img src="assets/ai-midnight-glamour.jpg" alt="午夜黑裙主题缩略图">
            <span><strong>午夜黑裙</strong><small>黑裙与城市夜色</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="crimsonsatin" role="listitem" aria-pressed="false">
            <img src="assets/ai-crimson-satin.jpg" alt="绯红缎光主题缩略图">
            <span><strong>绯红缎光</strong><small>红缎与暖金灯光</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="lofteditorial" role="listitem" aria-pressed="false">
            <img src="assets/ai-loft-editorial.jpg" alt="午后白衫主题缩略图">
            <span><strong>午后白衫</strong><small>白衫与自然日光</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="neonsilver" role="listitem" aria-pressed="false">
            <img src="assets/ai-neon-silver.jpg" alt="银蓝霓影主题缩略图">
            <span><strong>银蓝霓影</strong><small>银裙与未来霓虹</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="liuyifei" role="listitem" aria-pressed="false">
            <img src="assets/celebrity-liu-yifei.jpg" alt="刘亦菲主题缩略图">
            <span><strong>刘亦菲</strong><small>粉蓝盛典光影</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="zhangziyi" role="listitem" aria-pressed="false">
            <img src="assets/celebrity-zhang-ziyi.jpg" alt="章子怡主题缩略图">
            <span><strong>章子怡</strong><small>黑银电影质感</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="zhouxun" role="listitem" aria-pressed="false">
            <img src="assets/celebrity-zhou-xun.jpg" alt="周迅主题缩略图">
            <span><strong>周迅</strong><small>经典黑白留白</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="fanbingbing" role="listitem" aria-pressed="false">
            <img src="assets/celebrity-fan-bingbing.jpg" alt="范冰冰主题缩略图">
            <span><strong>范冰冰</strong><small>白金与翡翠色彩</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="annehathaway" role="listitem" aria-pressed="false">
            <img src="assets/celebrity-anne-hathaway.jpg" alt="安妮·海瑟薇主题缩略图">
            <span><strong>安妮·海瑟薇</strong><small>黑色长发与蓝调</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="emmawatson" role="listitem" aria-pressed="false">
            <img src="assets/celebrity-emma-watson.jpg" alt="艾玛·沃森主题缩略图">
            <span><strong>艾玛·沃森</strong><small>酒红礼服回眸</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="margotrobbie" role="listitem" aria-pressed="false">
            <img src="assets/celebrity-margot-robbie.jpg" alt="玛格特·罗比主题缩略图">
            <span><strong>玛格特·罗比</strong><small>白色蕾丝礼服</small></span>
          </button>
          <button class="theme-choice" type="button" data-theme-choice="scarlettjohansson" role="listitem" aria-pressed="false">
            <img src="assets/celebrity-scarlett-johansson.jpg" alt="斯嘉丽·约翰逊主题缩略图">
            <span><strong>斯嘉丽·约翰逊</strong><small>黑白薄纱腰封</small></span>
          </button>
        </div>
      </div>

      <div class="sidebar-foot">
        <span class="avatar">M</span>
        <div><strong>momo</strong><small id="current-theme-label">甜莓粉已启用</small></div>
        <span class="status-dot" aria-label="在线"></span>
      </div>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <div class="crumb"><span>主题工作台</span><b>/</b><strong id="topbar-title">甜莓粉</strong></div>
        <div class="top-actions">
          <button class="ghost-button" type="button" id="random-theme">随心换装</button>
          <span class="saved-state" id="saved-state">已自动保存</span>
        </div>
      </header>

      <section class="hero" aria-labelledby="hero-title">
        <img class="hero-image" id="hero-image" src="assets/sweet-berry.png" alt="甜莓粉主题人物主视觉">
        <div class="hero-shade"></div>
        <div class="hero-copy">
          <div class="eyebrow"><span id="theme-symbol">♥</span><span id="hero-kicker">甜莓灵感站</span></div>
          <h1 id="hero-title">今天想创造什么？</h1>
          <p id="hero-description">让柔软的粉色和草莓香气，陪你把灵感写成可以运行的代码。</p>
          <div class="hero-actions">
            <button class="primary-button" type="button">开始新任务</button>
            <button class="glass-button" type="button" id="open-drawer">浏览全部皮肤</button>
          </div>
        </div>
        <div class="floating-note"><b id="note-title">Sweet Code</b><span id="note-copy">温柔也可以很有力量</span></div>
      </section>

      <section class="feature-grid" aria-label="快捷能力">
        <button class="feature-card" type="button"><span class="feature-icon">&lt;/&gt;</span><strong>探索代码</strong><small>理解陌生项目和复杂逻辑</small></button>
        <button class="feature-card" type="button"><span class="feature-icon">✦</span><strong>构建功能</strong><small>把想法变成应用或工具</small></button>
        <button class="feature-card" type="button"><span class="feature-icon">✓</span><strong>审查改动</strong><small>发现风险并给出清晰建议</small></button>
        <button class="feature-card" type="button"><span class="feature-icon">⌁</span><strong>修复问题</strong><small>定位根因并完成可靠验证</small></button>
      </section>

      <section class="composer-card">
        <div class="composer-label"><span>⌨</span><strong id="composer-heading">与甜莓缪斯一起写代码</strong></div>
        <textarea id="composer" rows="3" aria-label="任务输入" placeholder="随心输入，让灵感陪你一起写代码吧……"></textarea>
        <div class="composer-actions">
          <button class="round-button" type="button" aria-label="添加附件">＋</button>
          <span class="access-pill">♡ 完全访问⌄</span>
          <span class="model-name">Codex · Muse</span>
          <button class="send-button" type="button" aria-label="发送">↑</button>
        </div>
      </section>
      <p class="source-note">新增时尚主题均为明确成年、虚构人物的 AI 原创图；真人主题使用 Wikimedia Commons 开放许可照片。<a href="../ATTRIBUTION.md">查看图片来源、生成说明和许可信息</a></p>
    </main>
  </div>

  <dialog class="theme-drawer" id="theme-drawer">
    <form method="dialog" class="drawer-panel">
      <div class="drawer-head"><div><span>THEME CLOSET</span><h2>挑选今天的灵感缪斯</h2></div><button type="submit" aria-label="关闭">×</button></div>
      <div class="drawer-grid" id="drawer-grid"></div>
    </form>
  </dialog>

  <script src="app.js"></script>
</body>
</html>
